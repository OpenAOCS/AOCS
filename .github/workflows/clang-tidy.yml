name: C++ static analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-format \
            clang-tools \
            clang-tidy \
            libjsoncpp-dev \
            ninja-build \
            pybind11-dev \
            python3-dev

      - name: Check clang-format
        run: python3 scripts/check_clang_format.py

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: >
          cmake --build build --parallel 4
          --target gnc_lib sim sim_math_tests aocs_orbit

      - name: Run clang-tidy across the repository
        run: python3 scripts/check_clang_tidy.py --build-dir build --jobs 4

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
